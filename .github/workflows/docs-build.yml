name: docs-build

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v2
      with:
        hugo-version: 'latest'
        extended: true

    - name: Build documentation
      run: |
        cd docs
        hugo --minify

    - name: Check translation protection
      run: python3 -B -m unittest discover -s docs/scripts -p 'test_translation*.py'

    - name: Check rendered documentation
      run: python3 docs/scripts/check_html.py docs/public

    - name: Request multilingual website deployment
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ secrets.OPENMLRL_TOKEN }}
      run: |
        python3 - <<'PYTHON'
        import json
        import os
        from pathlib import Path

        payload = {
            "event_type": "comlrl-docs-updated",
            "client_payload": {"docs_sha": os.environ["GITHUB_SHA"]},
        }
        destination = Path(os.environ["RUNNER_TEMP"]) / "comlrl-docs-dispatch.json"
        destination.write_text(json.dumps(payload), encoding="utf-8")
        PYTHON
        gh api --method POST repos/OpenMLRL/OpenMLRL.github.io/dispatches \
          --input "$RUNNER_TEMP/comlrl-docs-dispatch.json"
