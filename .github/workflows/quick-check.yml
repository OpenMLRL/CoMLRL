name: Quick Check

on:
  push:
    branches-ignore: [main]  # Run on all branches except main
  pull_request:
    types: [opened, synchronize]

jobs:
  quick-test:
    name: Quick Python 3.10 Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install package only
        run: |
          python -m pip install --upgrade pip
          pip install --no-deps -e .

      - name: Quick import test
        run: |
          python -c "import comlrl; print('✓ CoMLRL imported successfully')"

  pre-commit-quick:
    name: Pre-commit (fast checks only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run fast pre-commit hooks
        run: |
          pip install pre-commit
          pre-commit run --all-files check-yaml check-merge-conflict trailing-whitespace end-of-file-fixer
