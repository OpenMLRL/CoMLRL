name: Publish documentation

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Request a multilingual documentation deployment on OpenMLRL.github.io"
        required: true
        default: "false"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.152.2'
          extended: true

      - name: Build English documentation
        run: hugo --gc --minify -s docs -b "https://openmlrl.github.io/CoMLRL/"

      - name: Check translation protection
        run: python3 -B -m unittest discover -s docs/scripts -p test_translations.py

      - name: Check rendered documentation
        run: python3 docs/scripts/check_html.py docs/public

      - name: Request multilingual website deployment
        if: inputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.OPENMLRL_TOKEN }}
        run: |
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          payload = {
              "event_type": "comlrl-docs-updated",
              "client_payload": {"docs_sha": os.environ["GITHUB_SHA"]},
          }
          destination = Path(os.environ["RUNNER_TEMP"]) / "comlrl-docs-dispatch.json"
          destination.write_text(json.dumps(payload), encoding="utf-8")
          PYTHON
          gh api --method POST repos/OpenMLRL/OpenMLRL.github.io/dispatches \
            --input "$RUNNER_TEMP/comlrl-docs-dispatch.json"
