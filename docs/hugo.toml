baseURL = "/"              # Overridden by --baseURL at build time
title = "CoMLRL"
copyright = "© {year} OpenMLRL. All rights reserved."
languageCode = "en-us"
defaultContentLanguage = "en"
relativeURLs = false       # Preserve Hugo's baseURL-prefixed paths on GitHub Pages

enableGitInfo = true
disableKinds = ["taxonomy"]

[minify]
  # Keep mathematical glyph paths intact in the inline rollout diagrams.
  disableSVG = true

[params]
  BookTheme = "light"         # Base palette; theme.js applies system/user preference
  BookSection = "docs"
  BookToC = true
  BookSearch = true
  BookLogo = "img/comlrl-logo.png"
  BookRepo = "https://github.com/OpenMLRL/CoMLRL"
  BookRepoBranch = "main"
  BookEditPath = "edit/main/docs"
  BookDateFormat = "Jan 2, 2006"
  BookMath = true

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 2
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "friendly"
    lineNos = false
    lineNumbersInTable = false
    noClasses = false

[module]
  [[module.imports]]
    path = "github.com/alex-shpak/hugo-book"
