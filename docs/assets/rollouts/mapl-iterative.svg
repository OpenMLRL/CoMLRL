<svg xmlns="http://www.w3.org/2000/svg" class="algorithm-flow" width="720" height="282" viewBox="0 0 720 282">
  <title id="iteration-title">One iterative training round</title>
  <desc id="iteration-desc">Current actors and a comparator produce responses. Reward ranking creates preference pairs, replay selects training pairs, and either MADPO or reward-model training followed by RL updates the actors for the next round.</desc>
  <defs>
    <marker id="iteration-arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-purple)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="iteration-arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-teal)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="iteration-arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-amber)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="iteration-arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-muted)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="iteration-agent" class="af-icon">
      <path d="M0-10v-4"/><circle cy="-16" r="1.7"/>
      <rect x="-12" y="-10" width="24" height="21" rx="6"/>
      <path d="M-12-3h-3v8h3m24-8h3v8h-3M-4 6h8"/>
      <circle cx="-4.5" cy="-2" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="-2" r="1.2" fill="currentColor" stroke="none"/>
    </g>
    <g id="iteration-document" class="af-icon">
      <path d="M-10-14H3l7 7v21h-20Zm13 0v7h7M-5-1H5M-5 5H5M-5 10H2"/>
    </g>
  </defs>
  <g class="af-edge af-purple" data-rollout-stage="1" data-rollout-kind="edge">
    <path d="M158 65C183 65 177 104 202 104" marker-end="url(#iteration-arrow-purple)"/><circle class="af-dot" cx="158" cy="65" r="3.5"/>
  </g>
  <g class="af-edge af-teal" data-rollout-stage="1" data-rollout-kind="edge">
    <path d="M158 167C183 167 177 134 202 134" marker-end="url(#iteration-arrow-teal)"/><circle class="af-dot" cx="158" cy="167" r="3.5"/>
  </g>
  <g class="af-edge af-amber" data-rollout-stage="2" data-rollout-kind="edge">
    <path d="M312 119H351" marker-end="url(#iteration-arrow-amber)"/><circle class="af-dot" cx="312" cy="119" r="3.5"/>
  </g>
  <g class="af-edge af-neutral" data-rollout-stage="3" data-rollout-kind="edge">
    <path d="M459 105C479 105 479 69 499 69" marker-end="url(#iteration-arrow-neutral)"/><circle class="af-dot" cx="459" cy="105" r="3.5"/>
  </g>
  <g class="af-edge af-neutral" data-rollout-stage="3" data-rollout-kind="edge">
    <path d="M459 134C479 134 479 159 499 159" marker-end="url(#iteration-arrow-neutral)"/><circle class="af-dot" cx="459" cy="134" r="3.5"/>
  </g>
  <g class="af-edge af-purple" data-rollout-stage="4" data-rollout-kind="edge">
    <path d="M695 69H698Q704 69 704 75V218Q704 224 698 224H14Q8 224 8 218V70Q8 64 14 64H20" marker-end="url(#iteration-arrow-purple)"/><circle class="af-dot" cx="695" cy="69" r="3.5"/>
  </g>
  <g class="af-edge af-teal" data-rollout-stage="4" data-rollout-kind="edge">
    <path d="M695 159H706Q712 159 712 165V232Q712 238 706 238H22Q16 238 16 232V82Q16 76 20 76" marker-end="url(#iteration-arrow-teal)"/><circle class="af-dot" cx="695" cy="159" r="3.5"/>
  </g>
  <g class="af-node af-purple" data-rollout-stage="0" data-rollout-kind="node">
    <rect class="af-card" x="20" y="30" width="138" height="70" rx="12"/><use href="#iteration-agent" x="89" y="57"/><text class="af-small" x="89" y="88">Current actors</text>
  </g>
  <g class="af-node af-teal" data-rollout-stage="0" data-rollout-kind="node">
    <rect class="af-card" x="20" y="132" width="138" height="70" rx="12"/><use href="#iteration-agent" x="89" y="159"/><text class="af-label" x="89" y="190">Comparator</text>
  </g>
  <g class="af-node af-amber" data-rollout-stage="1" data-rollout-kind="node">
    <rect class="af-card" x="202" y="80" width="110" height="78" rx="12"/><g class="af-icon"><path d="M241 102h32m-16-7v24m-11 0h22m-23-17-7 12h14Zm24 0-7 12h14Z"/></g><text class="af-label" x="257" y="142">Rank pairs</text>
  </g>
  <g class="af-node af-neutral" data-rollout-stage="2" data-rollout-kind="node">
    <rect class="af-card" x="351" y="80" width="108" height="78" rx="12"/><g class="af-icon"><rect x="392" y="96" width="25" height="28" rx="4"/><path d="M387 101v25a4 4 0 0 0 4 4h21m-13-25h11m-11 6h11m-11 6h7"/></g><text class="af-label" x="405" y="146">Replay</text>
  </g>
  <g class="af-node af-purple" data-rollout-stage="3" data-rollout-kind="node">
    <rect class="af-card" x="499" y="36" width="196" height="66" rx="12"/><text class="af-label af-heading" x="597" y="64">MADPO</text><text class="af-small" x="597" y="88">Direct update</text>
  </g>
  <g class="af-node af-teal" data-rollout-stage="3" data-rollout-kind="node">
    <rect class="af-card" x="499" y="126" width="196" height="66" rx="12"/><text class="af-label af-heading" x="597" y="154">MARLHF</text><text class="af-small" x="597" y="178">Reward model → RL</text>
  </g>
  <g class="af-node af-neutral" data-rollout-stage="4" data-rollout-kind="node">
    <text class="af-small" x="360" y="267">Updated actors · next round</text>
  </g>
</svg>
