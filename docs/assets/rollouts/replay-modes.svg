<svg xmlns="http://www.w3.org/2000/svg" class="algorithm-flow" width="720" height="326" viewBox="0 0 720 326">
  <title id="replay-title">Replay selection modes</title>
  <desc id="replay-desc">Five round datasets run from oldest to newest. Current uses every current-round pair. Nearest-k samples the latest two non-empty rounds here; all-history samples all stored non-empty rounds equally; lambda-decay favors more recent rounds.</desc>
  <defs>
    <marker id="replay-arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-purple)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="replay-arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-teal)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="replay-arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-amber)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="replay-arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-muted)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="replay-agent" class="af-icon">
      <path d="M0-10v-4"/><circle cy="-16" r="1.7"/>
      <rect x="-12" y="-10" width="24" height="21" rx="6"/>
      <path d="M-12-3h-3v8h3m24-8h3v8h-3M-4 6h8"/>
      <circle cx="-4.5" cy="-2" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="-2" r="1.2" fill="currentColor" stroke="none"/>
    </g>
    <g id="replay-document" class="af-icon">
      <path d="M-10-14H3l7 7v21h-20Zm13 0v7h7M-5-1H5M-5 5H5M-5 10H2"/>
    </g>
  </defs>
  <g class="af-node af-neutral" data-rollout-stage="0" data-rollout-kind="node">
    <text class="af-small" x="272" y="27">Oldest</text><text class="af-small" x="512" y="27">Newest</text><path class="af-icon" d="M311 21H469" marker-end="url(#replay-arrow-neutral)"/>
  </g>
  <g class="af-node af-purple" data-rollout-stage="1" data-rollout-kind="node">
    <text class="af-label" x="112" y="78">current</text>
  </g>
  <g class="af-node af-purple" data-rollout-stage="1" data-rollout-kind="node">
    <g class="af-neutral"><rect class="af-chip" x="250" y="53" width="44" height="38" rx="8" opacity="0.16"/><path class="af-icon" d="M267 72h10" opacity=".35"/></g><g class="af-neutral"><rect class="af-chip" x="310" y="53" width="44" height="38" rx="8" opacity="0.16"/><path class="af-icon" d="M327 72h10" opacity=".35"/></g><g class="af-neutral"><rect class="af-chip" x="370" y="53" width="44" height="38" rx="8" opacity="0.16"/><path class="af-icon" d="M387 72h10" opacity=".35"/></g><g class="af-neutral"><rect class="af-chip" x="430" y="53" width="44" height="38" rx="8" opacity="0.16"/><path class="af-icon" d="M447 72h10" opacity=".35"/></g><g class="af-purple"><rect class="af-chip" x="490" y="53" width="44" height="38" rx="8" opacity="1"/><path class="af-icon" d="M504 67h16m-16 6h16m-16 6h10"/></g>
  </g>
  <g class="af-edge af-purple" data-rollout-stage="1" data-rollout-kind="edge">
    <path d="M544 72H592" marker-end="url(#replay-arrow-purple)"/><circle class="af-dot" cx="544" cy="72" r="3.5"/>
  </g>
  <g class="af-node af-purple" data-rollout-stage="1" data-rollout-kind="node">
    <rect class="af-card" x="600" y="50" width="96" height="44" rx="12"/><text class="af-label" x="648" y="78">All pairs</text>
  </g>
  <g class="af-node af-teal" data-rollout-stage="2" data-rollout-kind="node">
    <text class="af-label" x="112" y="139">nearest_k</text><text class="af-small" x="112" y="161">Latest 2 rounds</text>
  </g>
  <g class="af-node af-teal" data-rollout-stage="2" data-rollout-kind="node">
    <g class="af-neutral"><rect class="af-chip" x="250" y="114" width="44" height="38" rx="8" opacity="0.16"/><path class="af-icon" d="M267 133h10" opacity=".35"/></g><g class="af-neutral"><rect class="af-chip" x="310" y="114" width="44" height="38" rx="8" opacity="0.16"/><path class="af-icon" d="M327 133h10" opacity=".35"/></g><g class="af-neutral"><rect class="af-chip" x="370" y="114" width="44" height="38" rx="8" opacity="0.16"/><path class="af-icon" d="M387 133h10" opacity=".35"/></g><g class="af-teal"><rect class="af-chip" x="430" y="114" width="44" height="38" rx="8" opacity="1"/><path class="af-icon" d="M444 128h16m-16 6h16m-16 6h10"/></g><g class="af-teal"><rect class="af-chip" x="490" y="114" width="44" height="38" rx="8" opacity="1"/><path class="af-icon" d="M504 128h16m-16 6h16m-16 6h10"/></g>
  </g>
  <g class="af-edge af-teal" data-rollout-stage="2" data-rollout-kind="edge">
    <path d="M544 133H592" marker-end="url(#replay-arrow-teal)"/><circle class="af-dot" cx="544" cy="133" r="3.5"/>
  </g>
  <g class="af-node af-teal" data-rollout-stage="2" data-rollout-kind="node">
    <rect class="af-card" x="600" y="111" width="96" height="44" rx="12"/><text class="af-label" x="648" y="139">Sample</text>
  </g>
  <g class="af-node af-purple" data-rollout-stage="3" data-rollout-kind="node">
    <text class="af-label" x="112" y="200">all_history</text>
  </g>
  <g class="af-node af-purple" data-rollout-stage="3" data-rollout-kind="node">
    <g class="af-purple"><rect class="af-chip" x="250" y="175" width="44" height="38" rx="8" opacity="1"/><path class="af-icon" d="M264 189h16m-16 6h16m-16 6h10"/></g><g class="af-purple"><rect class="af-chip" x="310" y="175" width="44" height="38" rx="8" opacity="1"/><path class="af-icon" d="M324 189h16m-16 6h16m-16 6h10"/></g><g class="af-purple"><rect class="af-chip" x="370" y="175" width="44" height="38" rx="8" opacity="1"/><path class="af-icon" d="M384 189h16m-16 6h16m-16 6h10"/></g><g class="af-purple"><rect class="af-chip" x="430" y="175" width="44" height="38" rx="8" opacity="1"/><path class="af-icon" d="M444 189h16m-16 6h16m-16 6h10"/></g><g class="af-purple"><rect class="af-chip" x="490" y="175" width="44" height="38" rx="8" opacity="1"/><path class="af-icon" d="M504 189h16m-16 6h16m-16 6h10"/></g>
  </g>
  <g class="af-edge af-purple" data-rollout-stage="3" data-rollout-kind="edge">
    <path d="M544 194H592" marker-end="url(#replay-arrow-purple)"/><circle class="af-dot" cx="544" cy="194" r="3.5"/>
  </g>
  <g class="af-node af-purple" data-rollout-stage="3" data-rollout-kind="node">
    <rect class="af-card" x="600" y="172" width="96" height="44" rx="12"/><text class="af-label" x="648" y="200">Sample</text>
  </g>
  <g class="af-node af-amber" data-rollout-stage="4" data-rollout-kind="node">
    <text class="af-label" x="112" y="261">lambda_decay</text>
  </g>
  <g class="af-node af-amber" data-rollout-stage="4" data-rollout-kind="node">
    <g class="af-amber"><rect class="af-chip" x="250" y="236" width="44" height="38" rx="8" opacity="0.18"/><rect x="266" y="258" width="12" height="9" rx="3" fill="currentColor" opacity="0.549"/></g><g class="af-amber"><rect class="af-chip" x="310" y="236" width="44" height="38" rx="8" opacity="0.3"/><rect x="326" y="256" width="12" height="11" rx="3" fill="currentColor" opacity="0.615"/></g><g class="af-amber"><rect class="af-chip" x="370" y="236" width="44" height="38" rx="8" opacity="0.46"/><rect x="386" y="252" width="12" height="15" rx="3" fill="currentColor" opacity="0.7030000000000001"/></g><g class="af-amber"><rect class="af-chip" x="430" y="236" width="44" height="38" rx="8" opacity="0.68"/><rect x="446" y="248" width="12" height="19" rx="3" fill="currentColor" opacity="0.8240000000000001"/></g><g class="af-amber"><rect class="af-chip" x="490" y="236" width="44" height="38" rx="8" opacity="1"/><rect x="506" y="241" width="12" height="26" rx="3" fill="currentColor" opacity="1.0"/></g>
  </g>
  <g class="af-edge af-amber" data-rollout-stage="4" data-rollout-kind="edge">
    <path d="M544 255H592" marker-end="url(#replay-arrow-amber)"/><circle class="af-dot" cx="544" cy="255" r="3.5"/>
  </g>
  <g class="af-node af-amber" data-rollout-stage="4" data-rollout-kind="node">
    <rect class="af-card" x="600" y="233" width="96" height="44" rx="12"/><text class="af-label" x="648" y="261">Sample</text>
  </g>
  <g class="af-node af-neutral" data-rollout-stage="0" data-rollout-kind="node">
    <text class="af-small" x="393" y="309">Eligible rounds · selection weight</text>
  </g>
</svg>
