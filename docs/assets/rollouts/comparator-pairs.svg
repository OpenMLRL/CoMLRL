<svg xmlns="http://www.w3.org/2000/svg" class="algorithm-flow" width="720" height="266" viewBox="0 0 720 266">
  <title id="comparison-title">Comparator preference pairs</title>
  <desc id="comparison-desc">Current actors and a comparator respond to the same task. Same-index candidates are ranked by the task reward. Either side can become the winner; ties are skipped.</desc>
  <defs>
    <marker id="comparison-arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-purple)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="comparison-arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-teal)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="comparison-arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-amber)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="comparison-arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-muted)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="comparison-agent" class="af-icon">
      <path d="M0-10v-4"/><circle cy="-16" r="1.7"/>
      <rect x="-12" y="-10" width="24" height="21" rx="6"/>
      <path d="M-12-3h-3v8h3m24-8h3v8h-3M-4 6h8"/>
      <circle cx="-4.5" cy="-2" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="-2" r="1.2" fill="currentColor" stroke="none"/>
    </g>
    <g id="comparison-document" class="af-icon">
      <path d="M-10-14H3l7 7v21h-20Zm13 0v7h7M-5-1H5M-5 5H5M-5 10H2"/>
    </g>
  </defs>
  <g class="af-edge af-purple" data-rollout-stage="1" data-rollout-kind="edge">
    <path d="M124 124C145 124 145 68 166 68" marker-end="url(#comparison-arrow-purple)"/><circle class="af-dot" cx="124" cy="124" r="3.5"/>
  </g>
  <g class="af-edge af-teal" data-rollout-stage="1" data-rollout-kind="edge">
    <path d="M124 148C145 148 145 208 166 208" marker-end="url(#comparison-arrow-teal)"/><circle class="af-dot" cx="124" cy="148" r="3.5"/>
  </g>
  <g class="af-edge af-purple" data-rollout-stage="2" data-rollout-kind="edge">
    <path d="M304 68C328 68 325 100 349 100" marker-end="url(#comparison-arrow-purple)"/><circle class="af-dot" cx="304" cy="68" r="3.5"/>
  </g>
  <g class="af-edge af-teal" data-rollout-stage="2" data-rollout-kind="edge">
    <path d="M304 208C328 208 325 116 349 116" marker-end="url(#comparison-arrow-teal)"/><circle class="af-dot" cx="304" cy="208" r="3.5"/>
  </g>
  <g class="af-edge af-amber" data-rollout-stage="4" data-rollout-kind="edge">
    <path d="M482 168C512 168 512 140 542 140" marker-end="url(#comparison-arrow-amber)"/><circle class="af-dot" cx="482" cy="168" r="3.5"/>
  </g>
  <g class="af-node af-neutral" data-rollout-stage="0" data-rollout-kind="node">
    <rect class="af-card" x="24" y="101" width="100" height="70" rx="12"/><use href="#comparison-document" transform="translate(74 125) scale(.75)"/><text class="af-label" x="74" y="159">Task</text>
  </g>
  <g class="af-node af-purple" data-rollout-stage="1" data-rollout-kind="node">
    <rect class="af-card" x="166" y="34" width="138" height="68" rx="12"/><use href="#comparison-agent" transform="translate(222 59) scale(.72)"/><use href="#comparison-agent" transform="translate(248 59) scale(.72)"/><text class="af-small" x="235" y="91">Current actors</text>
  </g>
  <g class="af-node af-teal" data-rollout-stage="1" data-rollout-kind="node">
    <rect class="af-card" x="166" y="174" width="138" height="68" rx="12"/><use href="#comparison-agent" x="235" y="199"/><text class="af-label" x="235" y="231">Comparator</text>
  </g>
  <g class="af-node af-neutral" data-rollout-stage="2" data-rollout-kind="node">
    <rect class="af-card" x="349" y="72" width="133" height="128" rx="12"/><g class="af-icon"><path d="M399 94h32m-32 13h32"/><g class="af-purple"><circle cx="399" cy="94" r="3"/><circle cx="399" cy="107" r="3"/></g><g class="af-teal"><circle cx="431" cy="94" r="3"/><circle cx="431" cy="107" r="3"/></g></g>
  </g>
  <g class="af-edge af-neutral" data-rollout-stage="3" data-rollout-kind="edge">
    <path d="M415 119V148" marker-end="url(#comparison-arrow-neutral)"/><circle class="af-dot" cx="415" cy="119" r="3.5"/>
  </g>
  <g class="af-node af-amber" data-rollout-stage="3" data-rollout-kind="node">
    <rect class="af-chip" x="359" y="151" width="113" height="34" rx="10"/><text class="af-small" x="415" y="174">Task reward</text>
  </g>
  <g class="af-node af-neutral" data-rollout-stage="4" data-rollout-kind="node">
    <rect class="af-card" x="542" y="106" width="152" height="68" rx="12"/><g class="af-icon"><g class="af-neutral"><rect x="590" y="117" width="22" height="23" rx="5"/><path d="m595 128 4 4 8-9"/></g><g class="af-neutral"><rect x="623" y="117" width="22" height="23" rx="5"/><path d="m630 125 8 8m0-8-8 8"/></g></g><text class="af-label" x="618" y="162">Winner · loser</text><text class="af-small" x="618" y="202">Either side can win</text>
  </g>
  <g class="af-node af-neutral" data-rollout-stage="4" data-rollout-kind="node">
    <text class="af-small" x="415" y="230">Ties skipped</text>
  </g>
</svg>
