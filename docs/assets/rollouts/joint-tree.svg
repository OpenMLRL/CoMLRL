<svg xmlns="http://www.w3.org/2000/svg" class="algorithm-flow" width="720" height="280" viewBox="0 0 720 280" font-family="Inter, system-ui, sans-serif" font-size="18" text-anchor="middle">
  <title>Joint responses branch into independent rollouts</title>
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-purple, #7861b2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-teal, #438b84)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="agent-icon" class="af-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0-10v-4"/><circle cy="-16" r="1.8"/>
      <rect x="-13" y="-10" width="26" height="22" rx="6"/>
      <path d="M-13-3h-3v8h3m26-8h3v8h-3M-4 7h8"/>
      <circle cx="-5" cy="-2" r="1.3"/><circle cx="5" cy="-2" r="1.3"/>
    </g>
    <g id="response-icon" class="af-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-11-15H4l8 8v22h-23ZM4-15v8h8M-5-2H6M-5 4H6M-5 10H2"/>
    </g>
  </defs>
  <g class="af-edge af-purple" data-rollout-stage="1" data-rollout-kind="edge">
    <path d="M132 140C174 140 174 86 216 86" fill="none" stroke="currentColor" stroke-width="1.7" marker-end="url(#arrow-purple)"/><circle class="af-dot" r="3.5"/>
  </g>
  <g class="af-edge af-teal" data-rollout-stage="1" data-rollout-kind="edge">
    <path d="M132 140C174 140 174 200 216 200" fill="none" stroke="currentColor" stroke-width="1.7" marker-end="url(#arrow-teal)"/><circle class="af-dot" r="3.5"/>
  </g>
  <g class="af-edge af-purple" data-rollout-stage="2" data-rollout-kind="edge">
    <path d="M386 86C442 86 454 64 510 64" fill="none" stroke="currentColor" stroke-width="1.7" marker-end="url(#arrow-purple)"/><circle class="af-dot" r="3.5"/>
  </g>
  <g class="af-edge af-purple" data-rollout-stage="2" data-rollout-kind="edge">
    <path d="M386 86C442 86 454 120 510 120" fill="none" stroke="currentColor" stroke-width="1.7" marker-end="url(#arrow-purple)"/><circle class="af-dot" r="3.5"/>
  </g>
  <g class="af-edge af-teal" data-rollout-stage="2" data-rollout-kind="edge">
    <path d="M386 200C442 200 454 176 510 176" fill="none" stroke="currentColor" stroke-width="1.7" marker-end="url(#arrow-teal)"/><circle class="af-dot" r="3.5"/>
  </g>
  <g class="af-edge af-teal" data-rollout-stage="2" data-rollout-kind="edge">
    <path d="M386 200C442 200 454 232 510 232" fill="none" stroke="currentColor" stroke-width="1.7" marker-end="url(#arrow-teal)"/><circle class="af-dot" r="3.5"/>
  </g>
  <g class="af-node af-neutral" data-rollout-stage="0" data-rollout-kind="node">
    <text class="af-label af-heading" x="301" y="25">Turn 1</text>
    <text class="af-label af-heading" x="604" y="25">Next turn</text>
    <rect class="af-card" x="20" y="98" width="112" height="84" rx="12" fill="none" stroke="currentColor"/>
<use href="#response-icon" x="76" y="126"/>
    <text class="af-label" x="76" y="166">Task</text>
  </g>
  <g class="af-node af-purple" data-rollout-stage="1" data-rollout-kind="node">
    <rect class="af-card" x="216" y="58" width="170" height="56" rx="12" fill="none" stroke="currentColor"/>
<use href="#response-icon" x="241" y="86"/>
    <text class="af-label" x="315" y="92">Response A</text>
  </g>
  <g class="af-node af-teal" data-rollout-stage="1" data-rollout-kind="node">
    <rect class="af-card" x="216" y="172" width="170" height="56" rx="12" fill="none" stroke="currentColor"/>
<use href="#response-icon" x="241" y="200"/>
    <text class="af-label" x="315" y="206">Response B</text>
  </g>
  <g class="af-node af-purple" data-rollout-stage="2" data-rollout-kind="node">
    <rect class="af-card" x="510" y="43" width="188" height="42" rx="12" fill="none" stroke="currentColor"/>
    <text class="af-label" x="604" y="71">Rollout 1</text>
  </g>
  <g class="af-node af-purple" data-rollout-stage="2" data-rollout-kind="node">
    <rect class="af-card" x="510" y="99" width="188" height="42" rx="12" fill="none" stroke="currentColor"/>
    <text class="af-label" x="604" y="127">Rollout 2</text>
  </g>
  <g class="af-node af-teal" data-rollout-stage="2" data-rollout-kind="node">
    <rect class="af-card" x="510" y="155" width="188" height="42" rx="12" fill="none" stroke="currentColor"/>
    <text class="af-label" x="604" y="183">Rollout 3</text>
  </g>
  <g class="af-node af-teal" data-rollout-stage="2" data-rollout-kind="node">
    <rect class="af-card" x="510" y="211" width="188" height="42" rx="12" fill="none" stroke="currentColor"/>
    <text class="af-label" x="604" y="239">Rollout 4</text>
  </g>
  <g class="af-node af-neutral" data-rollout-stage="3" data-rollout-kind="node">
    <text class="af-small" x="360" y="275">Each branch has its own history</text>
  </g>
</svg>
