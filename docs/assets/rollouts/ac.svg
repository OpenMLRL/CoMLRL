<svg xmlns="http://www.w3.org/2000/svg" class="algorithm-flow" width="720" height="280" viewBox="0 0 720 280" font-family="Inter, system-ui, sans-serif" font-size="18" text-anchor="middle">
  <title>Actor-critic episodes advance one joint response per turn before buffering and updates</title>
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-purple, #7861b2)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-teal, #438b84)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="agent-icon" class="af-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M0-10v-4"/><circle cy="-16" r="1.8"/>
      <rect x="-13" y="-10" width="26" height="22" rx="6"/>
      <path d="M-13-3h-3v8h3m26-8h3v8h-3M-4 7h8"/>
      <circle cx="-5" cy="-2" r="1.3"/><circle cx="5" cy="-2" r="1.3"/>
    </g>
    <g id="response-icon" class="af-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-11-15H4l8 8v22h-23ZM4-15v8h8M-5-2H6M-5 4H6M-5 10H2"/>
    </g>
  </defs>
  <g class="af-edge af-purple" data-rollout-stage="1" data-rollout-kind="edge">
    <path d="M130 124H168" fill="none" stroke="currentColor" stroke-width="1.7" marker-end="url(#arrow-purple)"/><circle class="af-dot" r="3.5"/>
  </g>
  <g class="af-edge af-purple" data-rollout-stage="2" data-rollout-kind="edge">
    <path d="M280 124H318" fill="none" stroke="currentColor" stroke-width="1.7" marker-end="url(#arrow-purple)"/><circle class="af-dot" r="3.5"/>
  </g>
  <g class="af-edge af-purple" data-rollout-stage="3" data-rollout-kind="edge">
    <path d="M430 124H468" fill="none" stroke="currentColor" stroke-width="1.7" marker-end="url(#arrow-purple)"/><circle class="af-dot" r="3.5"/>
  </g>
  <g class="af-edge af-purple" data-rollout-stage="4" data-rollout-kind="edge">
    <path d="M580 124H618" fill="none" stroke="currentColor" stroke-width="1.7" marker-end="url(#arrow-purple)" stroke-dasharray="4 4"/><circle class="af-dot" r="3.5"/>
  </g>
  <g class="af-node af-purple" data-rollout-stage="0" data-rollout-kind="node">
    <rect class="af-card" x="18" y="66" width="112" height="116" rx="12" fill="none" stroke="currentColor"/>
    <text class="af-label af-heading" x="74" y="91">Turn 1</text>
<use href="#agent-icon" x="74" y="126"/>
    <text class="af-small" x="74" y="164">1 response</text>
  </g>
  <g class="af-node af-purple" data-rollout-stage="1" data-rollout-kind="node">
    <rect class="af-card" x="168" y="66" width="112" height="116" rx="12" fill="none" stroke="currentColor"/>
    <text class="af-label af-heading" x="224" y="91">Turn 2</text>
<use href="#agent-icon" x="224" y="126"/>
    <text class="af-small" x="224" y="164">1 response</text>
  </g>
  <g class="af-node af-purple" data-rollout-stage="2" data-rollout-kind="node">
    <rect class="af-card" x="318" y="66" width="112" height="116" rx="12" fill="none" stroke="currentColor"/>
    <text class="af-label af-heading" x="374" y="91">Final turn</text>
<use href="#agent-icon" x="374" y="126"/>
    <text class="af-small" x="374" y="164">1 response</text>
  </g>
  <g class="af-node af-teal" data-rollout-stage="3" data-rollout-kind="node">
    <rect class="af-card" x="468" y="66" width="112" height="116" rx="12" fill="none" stroke="currentColor"/>
    <text class="af-label af-heading" x="524" y="91">Buffer</text>
<g class="af-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><path d="m507 117 17-8 17 8-17 8Zm0 9 17 8 17-8m-34 9 17 8 17-8"/></g>
    <text class="af-small" x="524" y="164">Full episode</text>
  </g>
  <g class="af-node af-amber" data-rollout-stage="4" data-rollout-kind="node">
    <rect class="af-card" x="618" y="66" width="84" height="116" rx="12" fill="none" stroke="currentColor"/>
    <text class="af-label af-heading" x="660" y="91">Update</text>
<g class="af-icon" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M646 138v-24m0 24h28m-22-7 7-8 6 4 9-13m-7 0h7v7"/></g>
    <text class="af-small" x="660" y="164">Policy</text>
  </g>
  <g class="af-node af-neutral" data-rollout-stage="0" data-rollout-kind="node">
    <text class="af-small" x="224" y="225">One joint response per turn</text>
  </g>
  <g class="af-node af-neutral" data-rollout-stage="4" data-rollout-kind="node">
    <text class="af-small" x="586" y="215">At buffer limit</text>
    <text class="af-small" x="586" y="238">or epoch end</text>
  </g>
</svg>
