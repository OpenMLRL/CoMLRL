<svg xmlns="http://www.w3.org/2000/svg" class="algorithm-flow" width="720" height="294" viewBox="0 0 720 294">
  <title id="layouts-title">Actor and comparator layouts</title>
  <desc id="layouts-desc">Three supported layouts: per-role actors and per-role comparators; per-role actors with a joint comparator response split into roles; or one actor and one comparator retaining joint text.</desc>
  <defs>
    <marker id="layouts-arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-purple)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="layouts-arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-teal)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="layouts-arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-amber)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="layouts-arrow-neutral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="m2 2 5 3-5 3" fill="none" stroke="var(--af-muted)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <g id="layouts-agent" class="af-icon">
      <path d="M0-10v-4"/><circle cy="-16" r="1.7"/>
      <rect x="-12" y="-10" width="24" height="21" rx="6"/>
      <path d="M-12-3h-3v8h3m24-8h3v8h-3M-4 6h8"/>
      <circle cx="-4.5" cy="-2" r="1.2" fill="currentColor" stroke="none"/><circle cx="4.5" cy="-2" r="1.2" fill="currentColor" stroke="none"/>
    </g>
    <g id="layouts-document" class="af-icon">
      <path d="M-10-14H3l7 7v21h-20Zm13 0v7h7M-5-1H5M-5 5H5M-5 10H2"/>
    </g>
  </defs>
  <g class="af-node af-neutral" data-rollout-stage="0" data-rollout-kind="node">
    <text class="af-label af-heading" x="109" y="26">Actors</text><text class="af-label af-heading" x="360" y="26">Comparison</text><text class="af-label af-heading" x="611" y="26">Comparator</text>
  </g>
  <g class="af-edge af-purple" data-rollout-stage="3" data-rollout-kind="edge">
    <path d="M194 82H270" marker-end="url(#layouts-arrow-purple)"/><circle class="af-dot" cx="194" cy="82" r="3.5"/>
  </g>
  <g class="af-edge af-teal" data-rollout-stage="3" data-rollout-kind="edge">
    <path d="M526 82H450" marker-end="url(#layouts-arrow-teal)"/><circle class="af-dot" cx="526" cy="82" r="3.5"/>
  </g>
  <g class="af-edge af-purple" data-rollout-stage="3" data-rollout-kind="edge">
    <path d="M194 162H270" marker-end="url(#layouts-arrow-purple)"/><circle class="af-dot" cx="194" cy="162" r="3.5"/>
  </g>
  <g class="af-edge af-teal" data-rollout-stage="3" data-rollout-kind="edge">
    <path d="M526 162H450" marker-end="url(#layouts-arrow-teal)"/><circle class="af-dot" cx="526" cy="162" r="3.5"/>
  </g>
  <g class="af-edge af-purple" data-rollout-stage="3" data-rollout-kind="edge">
    <path d="M194 242H270" marker-end="url(#layouts-arrow-purple)"/><circle class="af-dot" cx="194" cy="242" r="3.5"/>
  </g>
  <g class="af-edge af-teal" data-rollout-stage="3" data-rollout-kind="edge">
    <path d="M526 242H450" marker-end="url(#layouts-arrow-teal)"/><circle class="af-dot" cx="526" cy="242" r="3.5"/>
  </g>
  <g class="af-node af-purple" data-rollout-stage="1" data-rollout-kind="node">
    <rect class="af-card" x="24" y="50" width="170" height="64" rx="12"/><use href="#layouts-agent" transform="translate(94 74) scale(.7)"/><use href="#layouts-agent" transform="translate(124 74) scale(.7)"/><text class="af-label" x="109" y="104">Per-role actors</text>
  </g>
  <g class="af-node af-teal" data-rollout-stage="2" data-rollout-kind="node">
    <rect class="af-card" x="526" y="50" width="170" height="64" rx="12"/><use href="#layouts-agent" transform="translate(596 74) scale(.7)"/><use href="#layouts-agent" transform="translate(626 74) scale(.7)"/><text class="af-label" x="611" y="104">Per-role policies</text>
  </g>
  <g class="af-node af-neutral" data-rollout-stage="4" data-rollout-kind="node">
    <rect class="af-card" x="270" y="50" width="180" height="64" rx="12"/><g class="af-purple"><use href="#layouts-document" transform="translate(344 72) scale(.65)"/></g><g class="af-teal"><use href="#layouts-document" transform="translate(376 72) scale(.65)"/></g><text class="af-label" x="360" y="104">Role responses</text>
  </g>
  <g class="af-node af-purple" data-rollout-stage="1" data-rollout-kind="node">
    <rect class="af-card" x="24" y="130" width="170" height="64" rx="12"/><use href="#layouts-agent" transform="translate(94 154) scale(.7)"/><use href="#layouts-agent" transform="translate(124 154) scale(.7)"/><text class="af-label" x="109" y="184">Per-role actors</text>
  </g>
  <g class="af-node af-teal" data-rollout-stage="2" data-rollout-kind="node">
    <rect class="af-card" x="526" y="130" width="170" height="64" rx="12"/><use href="#layouts-agent" x="611" y="154"/><text class="af-label" x="611" y="184">One joint policy</text>
  </g>
  <g class="af-node af-neutral" data-rollout-stage="4" data-rollout-kind="node">
    <rect class="af-card" x="270" y="130" width="180" height="64" rx="12"/><g class="af-purple"><use href="#layouts-document" transform="translate(344 152) scale(.65)"/></g><g class="af-teal"><use href="#layouts-document" transform="translate(376 152) scale(.65)"/></g><text class="af-label" x="360" y="184">Split into roles</text>
  </g>
  <g class="af-node af-purple" data-rollout-stage="1" data-rollout-kind="node">
    <rect class="af-card" x="24" y="210" width="170" height="64" rx="12"/><use href="#layouts-agent" x="109" y="234"/><text class="af-label" x="109" y="264">One joint actor</text>
  </g>
  <g class="af-node af-teal" data-rollout-stage="2" data-rollout-kind="node">
    <rect class="af-card" x="526" y="210" width="170" height="64" rx="12"/><use href="#layouts-agent" x="611" y="234"/><text class="af-label" x="611" y="264">One joint policy</text>
  </g>
  <g class="af-node af-neutral" data-rollout-stage="4" data-rollout-kind="node">
    <rect class="af-card" x="270" y="210" width="180" height="64" rx="12"/><g class="af-purple"><use href="#layouts-document" transform="translate(344 232) scale(.65)"/></g><g class="af-teal"><use href="#layouts-document" transform="translate(376 232) scale(.65)"/></g><text class="af-label" x="360" y="264">Joint text</text>
  </g>
</svg>
