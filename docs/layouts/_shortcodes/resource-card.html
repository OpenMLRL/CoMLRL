{{- $href := .Get "url" -}}
{{- with .Get "page" -}}
  {{- $href = ($.Site.GetPage .).RelPermalink -}}
{{- end -}}
<article class="docs-resource-card">
  <span class="docs-resource-kicker">{{ .Get "label" }}</span>
  <h3>{{ if $href }}<a class="docs-resource-title" href="{{ $href }}">{{ .Get "title" }}<svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 15 15 5M5 5h10v10" stroke-linecap="round" stroke-linejoin="round"/></svg></a>{{ else }}{{ .Get "title" }}{{ end }}</h3>
  <div class="docs-resource-description">{{ .Inner | strings.TrimSpace | markdownify }}</div>
</article>
