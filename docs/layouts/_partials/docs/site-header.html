{{ $area := partial "docs/nav-area" . }}
<header class="docs-site-header">
  <div class="docs-header-inner">
    <a class="docs-brand" href="{{ .Site.Home.RelPermalink }}" aria-label="CoMLRL documentation home">
      <img src="{{ .Site.Params.BookLogo | relURL }}" alt="CoMLRL" width="150" height="39" />
    </a>
    <div class="docs-header-search">
      {{ partial "docs/search" . }}
      <kbd data-search-shortcut aria-hidden="true">⌘ K</kbd>
    </div>
    <nav class="docs-header-links" aria-label="Project links">
      <a href="https://openmlrl.github.io">OpenMLRL <span aria-hidden="true">↗</span></a>
      <a href="{{ .Site.Params.BookRepo }}" class="docs-github-link">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.64-1.25-1.64-1.03-.7.08-.69.08-.69 1.14.08 1.74 1.17 1.74 1.17 1.01 1.73 2.65 1.23 3.3.94.1-.73.39-1.23.71-1.51-2.5-.28-5.13-1.25-5.13-5.56 0-1.23.44-2.23 1.16-3.02-.12-.29-.5-1.43.11-2.98 0 0 .95-.3 3.1 1.15a10.8 10.8 0 0 1 5.64 0c2.15-1.45 3.1-1.15 3.1-1.15.61 1.55.23 2.69.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.32-2.63 5.27-5.14 5.55.4.35.76 1.03.76 2.09v3.08c0 .3.2.65.77.54A11.25 11.25 0 0 0 12 .75Z"/></svg>
        <span>GitHub</span>
      </a>
    </nav>
  </div>
  <nav class="docs-area-tabs" aria-label="Documentation areas">
    <div class="docs-area-tabs-inner">
      <a href="{{ .Site.Home.RelPermalink }}"{{ if eq $area "docs" }} class="active" aria-current="page"{{ end }}>Documentation</a>
      {{ with .Site.GetPage "/docs/examples" }}
        <a href="{{ .RelPermalink }}"{{ if eq $area "example" }} class="active" aria-current="page"{{ end }}>Example</a>
      {{ end }}
    </div>
  </nav>
</header>
