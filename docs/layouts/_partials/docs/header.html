<div class="docs-mobile-controls">
  <button type="button" data-toggle="menu-control" aria-controls="site-navigation" aria-expanded="false">
    <img src="{{ partial "docs/icon" "menu" }}" class="book-icon" alt="" /> Menu
  </button>
  {{ if partial "docs/toc-show" . }}
  <button type="button" data-toggle="toc-control" aria-controls="mobile-toc" aria-expanded="false">
    <img src="{{ partial "docs/icon" "toc" }}" class="book-icon" alt="" /> On this page
  </button>
  {{ end }}
</div>
<noscript>
  <label for="menu-control">Menu</label>
  {{ if partial "docs/toc-show" . }}<label for="toc-control">On this page</label>{{ end }}
</noscript>
