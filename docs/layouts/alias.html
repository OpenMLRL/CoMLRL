<!DOCTYPE html>
<html lang="{{ with .Page }}{{ .Site.Language.Lang }}{{ else }}en{{ end }}">
<head>
  <meta charset="utf-8">
  <title>{{ .Permalink }}</title>
  <link rel="canonical" href="{{ .Permalink }}">
  {{ if and .Page (eq .Page.Path "/docs/dev/support") }}
    <script>
      // Keep bookmarks to the three parts of the former Developer guide.
      (function () {
        var hash = window.location.hash;
        var target = {{ .Permalink }};
        if (hash === '#contributing' || hash === '#development-guidelines') {
          target = {{ (.Page.Site.GetPage "/docs/dev/contributing").RelPermalink }};
        } else if (hash === '#changelog' || hash.indexOf('#version-') === 0) {
          target = {{ (.Page.Site.GetPage "/docs/dev/changelog").RelPermalink }};
        }
        window.location.replace(target + window.location.search + hash);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url={{ .Permalink }}"></noscript>
  {{ else }}
    <script>
      // Keep section anchors, such as those of the merged PbRL pages.
      window.location.replace({{ .Permalink }} + window.location.search + window.location.hash);
    </script>
    <noscript><meta http-equiv="refresh" content="0; url={{ .Permalink }}"></noscript>
  {{ end }}
</head>
<body>
  <p><a href="{{ .Permalink }}">Continue{{ with .Page }} to {{ .Title }}{{ end }}</a></p>
</body>
</html>
