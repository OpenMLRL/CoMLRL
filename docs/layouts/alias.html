<!DOCTYPE html>
<html lang="{{ .Page.Site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <title>{{ .Permalink }}</title>
  <link rel="canonical" href="{{ .Permalink }}">
  {{ if eq .Page.Path "/docs/multi-turn/algorithm" }}
    {{ with .Page.Site.GetPage "/docs/multi-turn/transition" }}
    <script>
      // Preserve bookmarks to the transition half of the former combined guide.
      (function () {
        var transitionAnchors = [
          '#environment-transition',
          '#custom-external-feedback',
          '#api-custom-external-feedback-interface',
          '#example-modes-expert-diagnosis-and-self-improvement',
          '#centralized-preference-collaboration',
          '#api-comparators'
        ];
        var target = transitionAnchors.indexOf(window.location.hash) !== -1
          ? {{ .RelPermalink }}
          : {{ $.Permalink }};
        window.location.replace(target + window.location.search + window.location.hash);
      })();
    </script>
    {{ end }}
    <noscript><meta http-equiv="refresh" content="0; url={{ .Permalink }}"></noscript>
  {{ else if eq .Page.Path "/docs/dev/support" }}
    <script>
      // Keep bookmarks to the three parts of the former Developer guide.
      (function () {
        var hash = window.location.hash;
        var target = {{ .Permalink }};
        if (hash === '#contributing' || hash === '#development-guidelines') {
          target = {{ (.Page.Site.GetPage "/docs/dev/contributing").RelPermalink }};
        } else if (hash === '#changelog' || hash.indexOf('#version-') === 0) {
          target = {{ (.Page.Site.GetPage "/docs/dev/changelog").RelPermalink }};
        }
        window.location.replace(target + window.location.search + hash);
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url={{ .Permalink }}"></noscript>
  {{ else }}
    <meta http-equiv="refresh" content="0; url={{ .Permalink }}">
  {{ end }}
</head>
<body>
  <p><a href="{{ .Permalink }}">Continue to {{ .Page.Title }}</a></p>
</body>
</html>
